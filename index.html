<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitación</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --acento: #7b4f8e; --acento-suave: #efe4f3; --fondo: #fbf8f5; --texto: #2b2230;
    --borde: rgb(43 34 48 / 0.12); --radio: 18px;
    --serif: "Cormorant Garamond", Georgia, serif; --sans: Inter, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  img, svg { max-width: 100%; display: block; }
  a { color: var(--acento); }
  button, input, select, textarea { font: inherit; }
  .demo-banda { position: sticky; top: 0; z-index: 30; background: var(--texto); color: #fff; font-size: 12px; text-align: center; padding: 6px 12px; }

  /* Portada con sobre */
  .portada { min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; position: relative; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, var(--acento-suave), var(--fondo) 70%); }
  .sobre { width: min(340px, 86vw); aspect-ratio: 3 / 2.2; position: relative; perspective: 900px; }
  .sobre__cuerpo { position: absolute; inset: 0; background: #fff; border-radius: 14px; box-shadow: 0 24px 60px rgb(43 34 48 / 0.18); border: 1px solid var(--borde); }
  .sobre__solapa { position: absolute; left: 0; right: 0; top: 0; height: 58%; transform-origin: top; transition: transform .9s cubic-bezier(.2,.7,.2,1);
    background: linear-gradient(160deg, var(--acento-suave), #fff); clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 14px 14px 0 0; }
  .sobre__sello { position: absolute; left: 50%; top: 52%; translate: -50% -50%; width: 64px; height: 64px; border-radius: 50%;
    background: var(--acento); color: #fff; display: grid; place-items: center; font-family: var(--serif); font-size: 26px; box-shadow: 0 6px 16px rgb(0 0 0 / .2); transition: opacity .4s; }
  .portada__texto { text-align: center; margin-top: 28px; }
  .portada__ocasion { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--acento); margin: 0; }
  .portada__nombre { font-family: var(--serif); font-size: clamp(54px, 16vw, 84px); line-height: 1; margin: 4px 0 6px; font-weight: 600; letter-spacing: .5px; }
  .portada__fecha { letter-spacing: .28em; text-transform: uppercase; font-size: 13px; margin: 0 0 22px; }
  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 26px; border-radius: 999px;
    border: 0; background: var(--acento); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; }
  .boton:focus-visible, .boton-sec:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  .boton-sec { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 999px;
    border: 1.5px solid var(--acento); color: var(--acento); background: transparent; font-weight: 600; text-decoration: none; cursor: pointer; }
  .abierta .sobre__solapa { transform: rotateX(180deg); }
  .abierta .sobre__sello { opacity: 0; }

  main { max-width: 560px; margin: 0 auto; padding: 0 20px 64px; }
  .seccion { padding: 44px 0 8px; text-align: center; }
  .seccion h2 { font-family: var(--serif); font-weight: 600; font-size: 34px; margin: 0 0 10px; }
  .adorno { width: 120px; height: 14px; margin: 0 auto 14px; color: var(--acento); }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: var(--radio); padding: 22px 20px; box-shadow: 0 8px 30px rgb(43 34 48 / .06); }

  .pase { margin-top: 28px; border: 1.5px dashed var(--acento); background: var(--acento-suave); }
  .pase__titulo { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; margin: 0; }
  .pase__nombre { font-family: var(--serif); font-size: 30px; font-weight: 600; margin: 4px 0; }
  .pase__lugares { margin: 0; font-weight: 600; color: var(--acento); }

  .cuenta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cuenta div { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 14px 4px; }
  .cuenta strong { display: block; font-family: var(--serif); font-size: 36px; line-height: 1; }
  .cuenta span { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }

  .acciones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  .alias { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; font-weight: 600; letter-spacing: .04em; margin: 10px 0 2px; overflow-wrap: anywhere; }

  form { text-align: start; display: grid; gap: 14px; }
  label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
  input, select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--borde); background: #fff; color: var(--texto); }
  textarea { min-height: 84px; resize: vertical; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border: 0; padding: 0; margin: 0; }
  .opciones legend { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .opcion input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .opcion span { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--borde); background: #fff; font-weight: 600; cursor: pointer; }
  .opcion input:checked + span { border-color: var(--acento); background: var(--acento-suave); color: var(--acento); }
  .opcion input:focus-visible + span { outline: 3px solid var(--texto); outline-offset: 2px; }
  .nota { font-size: 13px; opacity: .75; margin: 0; }
  .estado { margin: 0; font-weight: 600; min-height: 1.5em; }
  .estado--ok { color: #1f7a4d; } .estado--error { color: #a1263a; }
  footer { text-align: center; font-size: 13px; opacity: .7; padding: 20px; }

  .revelar { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; }
  .revelar.visible { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .sobre__solapa, .revelar { transition: none; }
    .revelar { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="demo-banda" id="demoBanda" hidden>Demostración con datos ficticios</div>

<header class="portada" id="portada">
  <div>
    <div class="sobre" aria-hidden="true">
      <div class="sobre__cuerpo"></div>
      <div class="sobre__solapa"></div>
      <div class="sobre__sello" id="sello">XV</div>
    </div>
    <div class="portada__texto">
      <p class="portada__ocasion" id="ocasion"></p>
      <h1 class="portada__nombre" id="nombre"></h1>
      <p class="portada__fecha" id="fechaCorta"></p>
      <a class="boton" href="#bienvenida" id="abrir">Abrir invitación</a>
    </div>
  </div>
</header>

<main>
  <section class="seccion revelar" id="bienvenida" aria-labelledby="t-bienvenida">
    <svg class="adorno" viewBox="0 0 120 14" aria-hidden="true"><path d="M0 7h46M74 7h46" stroke="currentColor" stroke-width="1.2"/><path d="M60 1l6 6-6 6-6-6z" fill="currentColor"/></svg>
    <h2 id="t-bienvenida">Te espero</h2>
    <p id="frase"></p>
    <div class="tarjeta pase" id="pase" hidden>
      <p class="pase__titulo">Pase personal</p>
      <p class="pase__nombre" id="paseNombre"></p>
      <p class="pase__lugares" id="paseLugares"></p>
    </div>
  </section>

  <section class="seccion revelar" aria-labelledby="t-cuenta">
    <h2 id="t-cuenta">Falta muy poco</h2>
    <div class="cuenta" id="cuenta" role="timer" aria-live="off">
      <div><strong id="cDias">0</strong><span>días</span></div>
      <div><strong id="cHoras">0</strong><span>horas</span></div>
      <div><strong id="cMin">0</strong><span>min</span></div>
      <div><strong id="cSeg">0</strong><span>seg</span></div>
    </div>
  </section>

  <section class="seccion revelar" aria-labelledby="t-donde">
    <h2 id="t-donde">Cuándo y dónde</h2>
    <div class="tarjeta">
      <p id="fechaLarga" style="font-weight:600;margin:0"></p>
      <p id="lugar" style="font-family:var(--serif);font-size:26px;margin:8px 0 0"></p>
      <p id="direccion" style="margin:2px 0 0"></p>
      <div class="acciones">
        <a class="boton-sec" id="maps" target="_blank" rel="noopener">Cómo llegar</a>
        <a class="boton-sec" id="gcal" target="_blank" rel="noopener">Agendar en Google</a>
        <button class="boton-sec" type="button" id="ics">Agendar (iPhone / otro)</button>
      </div>
    </div>
  </section>

  <section class="seccion revelar" aria-labelledby="t-dress" id="seccionDress">
    <h2 id="t-dress">Dress code</h2>
    <p id="dress"></p>
  </section>

  <section class="seccion revelar" aria-labelledby="t-regalos" id="seccionRegalos">
    <h2 id="t-regalos">Regalos</h2>
    <div class="tarjeta">
      <p id="regalosTexto" style="margin:0"></p>
      <p class="alias" id="alias"></p>
      <p class="nota" id="titular"></p>
      <div class="acciones"><button class="boton-sec" type="button" id="copiar">Copiar alias</button></div>
      <p class="estado" id="estadoCopia" role="status"></p>
    </div>
  </section>

  <section class="seccion revelar" aria-labelledby="t-rsvp" id="confirmar">
    <h2 id="t-rsvp">Confirmá tu asistencia</h2>
    <p class="nota" id="limite"></p>
    <div class="tarjeta" style="margin-top:14px">
      <form id="formRsvp" novalidate>
        <label>Nombre y apellido<input id="fNombre" name="nombre" autocomplete="name" required></label>
        <fieldset class="opciones">
          <legend>¿Vas a venir?</legend>
          <label class="opcion"><input type="radio" name="asiste" value="si" checked><span>Sí, voy</span></label>
          <label class="opcion"><input type="radio" name="asiste" value="no"><span>No puedo</span></label>
        </fieldset>
        <label id="lCantidad">¿Cuántas personas?<select id="fCantidad" name="cantidad"></select></label>
        <label id="lRestr">Restricciones alimentarias (opcional)<input id="fRestr" name="restricciones" placeholder="Ej.: 1 celíaco, 1 vegetariano"></label>
        <label id="lCancion">Una canción que no puede faltar (opcional)<input id="fCancion" name="cancion"></label>
        <label>Mensaje (opcional)<textarea id="fMensaje" name="mensaje"></textarea></label>
        <button class="boton" type="submit" id="enviar">Enviar confirmación</button>
        <p class="estado" id="estadoRsvp" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
<footer>Invitación digital · <span id="pie"></span></footer>

<script>
(() => {
  const E = window.EVENTO;
  const $ = (id) => document.getElementById(id);
  const r = document.documentElement.style;
  r.setProperty('--acento', E.tema.acento); r.setProperty('--acento-suave', E.tema.acentoSuave);
  r.setProperty('--fondo', E.tema.fondo); r.setProperty('--texto', E.tema.texto);

  const fecha = new Date(E.fecha);
  const fmtLarga = new Intl.DateTimeFormat('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'America/Argentina/Buenos_Aires' });
  const fmtCorta = new Intl.DateTimeFormat('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'America/Argentina/Buenos_Aires' });

  document.title = `${E.ocasion} · ${E.nombre}`;
  $('demoBanda').hidden = !E.demo;
  $('ocasion').textContent = E.ocasion;
  $('nombre').textContent = E.nombre;
  $('fechaCorta').textContent = fmtCorta.format(fecha).replaceAll('/', ' · ');
  $('frase').textContent = E.frase;
  $('fechaLarga').textContent = fmtLarga.format(fecha) + ' h';
  $('lugar').textContent = E.fiesta.lugar;
  $('direccion').textContent = E.fiesta.direccion;
  $('maps').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(E.fiesta.mapsQuery || E.fiesta.direccion);
  $('pie').textContent = `${E.ocasion} de ${E.nombre}`;
  if (E.dressCode) $('dress').textContent = E.dressCode; else $('seccionDress').hidden = true;
  if (E.regalos?.alias) {
    $('regalosTexto').textContent = E.regalos.texto; $('alias').textContent = E.regalos.alias; $('titular').textContent = E.regalos.titular || '';
  } else $('seccionRegalos').hidden = true;

  // Pase personal: ?p=<base64url de {"n":"Familia Pérez","l":4,"id":"ab12"}>
  let pase = null;
  try {
    const p = new URLSearchParams(location.search).get('p');
    if (p) {
      const json = decodeURIComponent(escape(atob(p.replace(/-/g, '+').replace(/_/g, '/'))));
      const d = JSON.parse(json);
      if (d && typeof d.n === 'string' && Number.isInteger(d.l) && d.l > 0 && d.l < 50) pase = d;
    }
  } catch (e) { pase = null; }
  if (pase) {
    $('pase').hidden = false;
    $('paseNombre').textContent = pase.n;
    $('paseLugares').textContent = pase.l === 1 ? '1 lugar reservado' : `${pase.l} lugares reservados`;
    $('fNombre').value = pase.n;
  }
  const maxLugares = pase ? pase.l : 6;
  for (let i = 1; i <= maxLugares; i++) $('fCantidad').add(new Option(String(i), String(i)));
  $('fCantidad').value = String(maxLugares);

  // Cuenta regresiva
  const tick = () => {
    const ms = Math.max(0, fecha - Date.now());
    $('cDias').textContent = Math.floor(ms / 864e5);
    $('cHoras').textContent = Math.floor(ms / 36e5) % 24;
    $('cMin').textContent = Math.floor(ms / 6e4) % 60;
    $('cSeg').textContent = Math.floor(ms / 1e3) % 60;
  };
  tick(); setInterval(tick, 1000);

  // Agenda
  const fin = new Date(fecha.getTime() + (E.duracionHoras || 6) * 36e5);
  const z = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const titulo = `${E.ocasion} de ${E.nombre}`;
  $('gcal').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(titulo) +
    '&dates=' + z(fecha) + '/' + z(fin) + '&location=' + encodeURIComponent(E.fiesta.lugar + ', ' + E.fiesta.direccion);
  $('ics').addEventListener('click', () => {
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//invitacion//es', 'BEGIN:VEVENT', 'UID:' + z(fecha) + '@invitacion',
      'DTSTAMP:' + z(new Date()), 'DTSTART:' + z(fecha), 'DTEND:' + z(fin), 'SUMMARY:' + titulo,
      'LOCATION:' + (E.fiesta.lugar + ', ' + E.fiesta.direccion).replace(/,/g, '\\,'), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = 'evento.ics'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // Copiar alias
  $('copiar').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(E.regalos.alias); $('estadoCopia').textContent = 'Alias copiado'; }
    catch (e) { $('estadoCopia').textContent = 'No se pudo copiar: seleccioná el alias y copialo a mano'; }
  });

  // Portada
  $('abrir').addEventListener('click', () => document.getElementById('portada').classList.add('abierta'));

  // RSVP
  const lim = new Date(E.rsvp.fechaLimite + 'T23:59:00-03:00');
  $('limite').textContent = 'Por favor, confirmá antes del ' + new Intl.DateTimeFormat('es-AR', { day: 'numeric', month: 'long' }).format(lim) + '.';
  $('lRestr').hidden = !E.rsvp.pedirRestricciones; $('lCancion').hidden = !E.rsvp.pedirCancion;
  const form = $('formRsvp');
  form.addEventListener('change', () => { $('lCantidad').hidden = form.asiste.value === 'no'; });
  const clave = 'rsvp-' + E.nombre + '-' + (pase?.id || 'general');
  try { if (localStorage.getItem(clave)) $('estadoRsvp').textContent = 'Ya enviaste tu confirmación desde este teléfono. Podés enviarla de nuevo si cambió algo.'; } catch (e) {}
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const est = $('estadoRsvp'); est.className = 'estado';
    const nombre = $('fNombre').value.trim();
    if (!nombre) { est.textContent = 'Escribí tu nombre para confirmar.'; est.classList.add('estado--error'); $('fNombre').focus(); return; }
    const datos = {
      pase: pase?.id || '', paseNombre: pase?.n || '', lugaresAsignados: pase?.l || '',
      nombre, asiste: form.asiste.value, cantidad: form.asiste.value === 'no' ? 0 : Number($('fCantidad').value),
      restricciones: $('fRestr').value.trim(), cancion: $('fCancion').value.trim(), mensaje: $('fMensaje').value.trim()
    };
    $('enviar').disabled = true; est.textContent = 'Enviando…';
    try {
      if (E.rsvp.endpoint) {
        // text/plain evita la verificación CORS previa; Apps Script lee e.postData.contents.
        await fetch(E.rsvp.endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(datos) });
      }
      try { localStorage.setItem(clave, JSON.stringify(datos)); } catch (e) {}
      est.textContent = E.rsvp.endpoint
        ? (datos.asiste === 'si' ? '¡Gracias! Tu confirmación quedó registrada.' : 'Gracias por avisar. Te vamos a extrañar.')
        : 'Modo demostración: la confirmación no se envió a ninguna planilla.';
      est.classList.add('estado--ok');
    } catch (e) {
      est.textContent = 'No se pudo enviar. Revisá tu conexión y probá de nuevo.'; est.classList.add('estado--error');
    } finally { $('enviar').disabled = false; }
  });

  // Animación de aparición
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((x) => { if (x.isIntersecting) { x.target.classList.add('visible'); io.unobserve(x.target); } }), { threshold: .12 }) : null;
  document.querySelectorAll('.revelar').forEach((el) => io ? io.observe(el) : el.classList.add('visible'));
  // Modo captura (para mockups): muestra todo sin animación y salta a la sección del hash.
  if (new URLSearchParams(location.search).has('captura')) {
    document.documentElement.style.scrollBehavior = 'auto';
    document.querySelectorAll('.revelar').forEach((el) => { el.style.transition = 'none'; el.classList.add('visible'); });
    const destino = location.hash && document.querySelector(location.hash);
    if (destino) setTimeout(() => destino.scrollIntoView({ block: 'start' }), 50);
  }
})();
</script>
</body>
</html>
